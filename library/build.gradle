plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.appstronautstudios.universalstoremanager'
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.appstronautstudios'
                artifactId = 'universalstoremanager'
                version = '0.5.6'
            }
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.security:security-crypto:1.1.0"

    // 'api' exposes this dependency transitively to any module that imports this library. Useful
    // for exposing billing specific classes like Purchase
    api 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.code.gson:gson:2.14.0'
}
